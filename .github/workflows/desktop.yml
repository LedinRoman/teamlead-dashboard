name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Team Lead Dashboard ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            A local dashboard for the person running a Jira team. No account on our side. The Jira token stays on this computer.

            ## Install

            **Windows.** Download the `win-x64.exe` and open it. If SmartScreen appears, choose More info, then Run anyway. The build is not code-signed.

            **Mac.** Download the zip for Apple silicon (`mac-arm64`) or Intel (`mac-x64`). Unzip, then open Team Lead Dashboard. The first time, right-click the app and choose Open.

            Paste a Jira URL and a token in Settings, then pick the boards under Teams. The interface is English. Settings switches it to Russian and offers five color themes. Both stay on this computer.
